name: deploy-hourly-deal-feed

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy-view:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/database-tunnel
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          ssh-private-key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          ssh-host: ${{ vars.OCI_SSH_HOST }}
          ssh-user: ${{ vars.OCI_SSH_USER }}
          database-host: ${{ vars.OCI_DB_PRIVATE_HOST }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install and verify hourly deal view
        run: python -u scripts/deploy_hourly_deal_view.py
