<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amazon AU deals</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101720;color:#eef4fa;font:15px/1.5 system-ui,sans-serif}main{max-width:1150px;margin:36px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:28px;margin:0;letter-spacing:-.6px}a{color:#9bdcff;text-decoration:none}a:hover{text-decoration:underline}small,.muted{color:#a2b2c4}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:18px}input,select,button{font:inherit;color:#eef4fa;background:#1b2939;border:1px solid #3c5068;border-radius:8px;padding:10px 12px}input[type=search]{flex:1;min-width:170px}label{font-size:12px;color:#a2b2c4}label input{display:block;width:110px}button{cursor:pointer}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button.active{border-color:#a8edc9;color:#a8edc9}table{width:100%;border-collapse:collapse;background:#172230;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:17px 20px;border-bottom:1px solid #2b3c50}th{font-size:12px;color:#a2b2c4;font-weight:500}th:nth-child(n+2),td:nth-child(n+2){text-align:right;white-space:nowrap}td:nth-child(2){font-weight:700;font-size:18px}td:nth-child(3){color:#a8edc9;font-weight:600}td:first-child{width:70%}.tag{font-size:11px;color:#ffd095;margin-left:8px}.empty{text-align:center!important;color:#a2b2c4;font-size:14px!important;font-weight:400!important;padding:36px}#error:empty{display:none}#error{color:#ffd095;margin:10px 0}footer{margin:16px 0;color:#899db4;font-size:12px}@media(max-width:650px){main{padding:0 12px;margin-top:24px}header{display:block}h1{font-size:25px}th,td{padding:13px 10px;font-size:13px}td:nth-child(2){font-size:15px}label input{width:95px}.controls select{max-width:100%}}
</style></head><body><main>
<header><h1>Amazon AU deals</h1><small id="updated">Loading…</small></header>
<div class="controls"><input id="search" type="search" aria-label="Search item" placeholder="Search items"><label>Min A$<input id="min-price" type="number" min="0" step="0.01" placeholder="0"></label><label>Max A$<input id="max-price" type="number" min="0" step="0.01" placeholder="Any"></label><select id="sort" aria-label="Sort deals"><option value="discount">Biggest discount %</option><option value="saving">Biggest discount A$</option><option value="price">Price: low to high</option><option value="price-desc">Price: high to low</option></select><button id="clear-price">Clear</button></div>
<div class="filters"><button class="active" data-filter="all">All deals</button><button data-filter="errors">Possible price errors</button><button data-filter="double">Double checked</button><button data-filter="community">Community quotes</button></div>
<div id="error" role="alert"></div><p id="count" class="muted"></p>
<table><thead><tr><th scope="col">Item</th><th scope="col">Price</th><th scope="col">Discount</th></tr></thead><tbody id="deals"><tr><td class="empty" colspan="3">Loading deals…</td></tr></tbody></table>
<footer>Discounts use displayed reference prices. Community quotes are unverified. Prices exclude delivery.</footer>
</main><script>
let state={products:[],community_leads:[]},filter='all';
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aud=n=>Number.isFinite(n)?new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(n/100):'—';
const fresh=p=>p.observed&&Date.now()-Date.parse(p.observed)<=15*60000;
const anomaly=p=>fresh(p)&&p.historical_drop_percent>=60&&p.baseline_cents-p.cents>=3000;
const priceBounds=()=>{const min=document.getElementById('min-price').value,max=document.getElementById('max-price').value;return {min:min===''?0:Math.round(Number(min)*100),max:max===''?Infinity:Math.round(Number(max)*100)}};
const inPriceRange=(cents,bounds)=>Number.isFinite(cents)&&cents>=bounds.min&&cents<=bounds.max;
function compareDeals(a,b,sort){return sort==='discount'?(b.advertised_discount_percent||0)-(a.advertised_discount_percent||0):sort==='saving'?Math.max(0,(b.reference_cents||b.cents)-b.cents)-Math.max(0,(a.reference_cents||a.cents)-a.cents):sort==='price'?a.cents-b.cents:sort==='price-desc'?b.cents-a.cents:0}
function shortName(p){const title=(p.title||p.asin).split(/,|\s[|–]\s/)[0];return title.length<=100?title:title.slice(0,97).trimEnd()+'…'}
function render(){
 const bounds=priceBounds(),query=document.getElementById('search').value.toLowerCase();let rows;
 if(filter==='community')rows=(state.community_leads||[]).filter(l=>!l.expired&&l.quoted_cents&&l.published&&Date.now()-Date.parse(l.published)<48*3600000).map(l=>({...l,cents:l.quoted_cents,quote:true,advertised_discount_percent:l.reference_cents?Math.round(1000*(1-l.quoted_cents/l.reference_cents))/10:null}));
 else rows=(state.products||[]).filter(p=>p.cents&&fresh(p));
 const total=rows.length;
 if(filter==='errors')rows=rows.filter(p=>anomaly(p)||(p.signals||[]).some(s=>s.includes('reports a price error')));
 if(filter==='double')rows=rows.filter(p=>p.double_checked);
 rows=rows.filter(p=>inPriceRange(p.cents,bounds)&&[p.title,p.asin].join(' ').toLowerCase().includes(query));rows.sort((a,b)=>compareDeals(a,b,document.getElementById('sort').value));
 document.getElementById('count').textContent=(filter==='community'?'Total community quotes: ':'Total deals: ')+total.toLocaleString('en-AU')+' · Showing: '+rows.length.toLocaleString('en-AU');
 document.getElementById('deals').innerHTML=rows.map(p=>'<tr><td><a title="'+e(p.title)+'" target="_blank" rel="noopener" href="https://www.amazon.com.au/dp/'+e(p.asin)+'">'+e(shortName(p))+'</a>'+(p.quote?'<span class="tag">Unverified</span>':'')+'</td><td>'+aud(p.cents)+'</td><td>'+(p.advertised_discount_percent>0?e(p.advertised_discount_percent)+'% · '+aud(Math.max(0,p.reference_cents-p.cents)):'—')+'</td></tr>').join('')||'<tr><td class="empty" colspan="3">'+(filter==='errors'?'No possible pricing errors verified yet.':'No matching current offers.')+'</td></tr>';
 document.getElementById('updated').textContent=state.generated_at?'Updated '+new Date(state.generated_at).toLocaleTimeString('en-AU',{timeZone:'Australia/Perth',hour12:false})+' AWST':'';
}
async function refresh(){try{if(globalThis.location?.protocol==='file:'){state=JSON.parse(document.getElementById('snapshot').textContent);render();if(!globalThis.fileReload)globalThis.fileReload=setTimeout(()=>location.reload(),60000);return}const r=await fetch('/api/latest',{cache:'no-store'});if(!r.ok)throw Error('Report unavailable');state=await r.json();render();document.getElementById('error').textContent=''}catch(error){document.getElementById('error').textContent='Refresh unavailable; displayed prices may be stale.'}}
['search','min-price','max-price'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.getElementById('sort').addEventListener('change',render);document.getElementById('clear-price').addEventListener('click',()=>{document.getElementById('min-price').value='';document.getElementById('max-price').value='';render()});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}));refresh();setInterval(refresh,15000);
</script></body></html>
